services:
  workadventure-presence-notifier:
    image: workadventure-presence-notifier:integration-16d6270
    build:
      context: https://github.com/Arata1202/workadventure-presence-notifier.git#16d62703befef1674be332e5e4e6c988634f76d3
      args:
        VERSION: integration-16d6270
    restart: unless-stopped
    environment:
      SLACK_WEBHOOK_URL: "${SLACK_WEBHOOK_URL:?Set SLACK_WEBHOOK_URL in the encrypted .env file}"
    volumes:
      - ./presence-notifier/config.yaml:/etc/workadventure-presence-notifier/config.yaml:ro
    command:
      - --config
      - /etc/workadventure-presence-notifier/config.yaml
    depends_on:
      - back
