name: Upload WA maps

on:
  workflow_dispatch:

concurrency:
  group: upload-wa-maps
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  actions: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Validate upload mode
        env:
          UPLOAD_MODE: ${{ secrets.UPLOAD_MODE }}
        run: |
          case "$UPLOAD_MODE" in
            MAP_STORAGE|GH_PAGES) echo "UPLOAD_MODE=$UPLOAD_MODE" >> "$GITHUB_ENV" ;;
            *) echo "::error::UPLOAD_MODE must be MAP_STORAGE or GH_PAGES"; exit 1 ;;
          esac

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: tools/map-starter-kit/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: tools/map-starter-kit

      - name: Prepare Map Workspace
        run: ./scripts/map-workspace.sh prepare

      - name: Build project
        run: npm run buildmap
        working-directory: tools/map-starter-kit

      - name: Deploy using WA Map Storage
        if: ${{ env.UPLOAD_MODE == 'MAP_STORAGE' }}
        working-directory: tools/map-starter-kit
        env:
          MAP_STORAGE_API_KEY: ${{ secrets.MAP_STORAGE_API_KEY }}
          MAP_STORAGE_URL: ${{ secrets.MAP_STORAGE_URL }}
          UPLOAD_DIRECTORY: ${{ secrets.UPLOAD_DIRECTORY }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          : "${MAP_STORAGE_API_KEY:?Set the MAP_STORAGE_API_KEY secret}"
          : "${MAP_STORAGE_URL:?Set the MAP_STORAGE_URL secret}"
          export UPLOAD_DIRECTORY="${UPLOAD_DIRECTORY:-${GITHUB_REPOSITORY_OWNER}-${REPOSITORY_NAME}}"
          npm run upload-only

      - name: Deploy using Github Pages
        if: ${{ env.UPLOAD_MODE == 'GH_PAGES' }}
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: tools/map-starter-kit/dist/
